name: Firebase App Distribution (Dev Branch)

on:
  push:
    branches:
      - dev

jobs:
  build:
    name: Build and Distribute Dev APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode service account json
        run: |
          cat ${GITHUB_WORKSPACE}/service-account.json
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > ${GITHUB_WORKSPACE}/service-account.json

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v2

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload to Firebase App Distribution
        run: |
          ./gradlew appDistributionUploadRelease \
            -PfirebaseServiceAccountFile=${GITHUB_WORKSPACE}/service-account.json \
            -PappDistributionReleaseNotes="Dev branch build: ${{ github.sha }}" \
            -PappDistributionGroups="testers" \
            -PfirebaseAppId="1:239854791261:android:a42e33b8c72236339afbb4" \
